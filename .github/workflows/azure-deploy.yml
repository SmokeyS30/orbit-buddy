# Auto-deploy Orbit Buddy to Azure Container Apps on push to main
      # Requires these GitHub secrets:
#   AZURE_CLIENT_ID - Entra app (service principal) client ID for OIDC federated auth
#   AZURE_TENANT_ID - Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID - Azure subscription ID
# Container images are pushed to GHCR using the built-in GITHUB_TOKEN
# (requires packages: write permission on the build-and-deploy job).
#
# Deployment safety is implemented and tested in scripts/deploy-containerapp.mjs.
# The deploy job fails if either release verification or rollback fails.

name: Deploy to Azure

concurrency:
  group: orbit-buddy-production
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths-ignore:
      - 'infra/**'
      - '**.md'
  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest
    # PostgreSQL 16 service: the integration test must run (not skip) as
    # part of the deployment gate. Deployment is blocked until it passes.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbit_test
          POSTGRES_PASSWORD: orbit_test_pw
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit_test -d orbit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://orbit_test:orbit_test_pw@localhost:5432/orbit_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Bump service worker cache version
        run: |
          VER="orbit-buddy-$(echo $GITHUB_SHA | cut -c1-7)"
          sed -i "s/const CACHE = 'orbit-buddy-v[^']*';/const CACHE = '$VER';/" public/sw.js
          grep -n "const CACHE" public/sw.js

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/smokeys30/orbit-buddy:${{ github.sha }}
          build-args: RELEASE_SHA=${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Read only. The PostgreSQL server is externally managed; this reports
      # its actual PITR window without changing retention, redundancy or cost.
      # RBAC may not allow this query, in which case the deployment still runs
      # and the unavailable inspection must be reported separately.
      - name: Inspect PostgreSQL PITR configuration
        continue-on-error: true
        run: |
          az postgres flexible-server show \
            --resource-group orbit-buddy-rg --name orbit-buddy-pg \
            --query '{state:state,retentionDays:backup.backupRetentionDays,earliestRestoreDate:backup.earliestRestoreDate,geoRedundantBackup:backup.geoRedundantBackup}' \
            --output json

      - name: Deploy, verify and roll back on failure
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/deploy-containerapp.mjs

# Auto-deploy Orbit Buddy to Azure Container Apps on push to main
# Requires these GitHub secrets:
#   AZURE_CLIENT_ID - Entra app (service principal) client ID for OIDC federated auth
#   AZURE_TENANT_ID - Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID - Azure subscription ID
# Container images are pushed to GHCR using the built-in GITHUB_TOKEN
# (requires packages: write permission on the build-and-deploy job).
#
# Deployment safety (single-revision mode): before pushing the new image, this
# workflow captures the currently-deployed image. After deployment it waits for
# the new revision to become healthy and tests the public /healthz endpoint.
# If verification fails, it rolls back by redeploying the previous image.

name: Deploy to Azure

concurrency:
  group: orbit-buddy-production
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths-ignore:
      - 'infra/**'
      - '**.md'

jobs:
  test:
    runs-on: ubuntu-latest
    # PostgreSQL 16 service: the integration test must run (not skip) as
    # part of the deployment gate. Deployment is blocked until it passes.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbit_test
          POSTGRES_PASSWORD: orbit_test_pw
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit_test -d orbit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://orbit_test:orbit_test_pw@localhost:5432/orbit_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    outputs:
      new_revision: ${{ steps.deploy.outputs.new_revision }}
      prev_image: ${{ steps.deploy.outputs.prev_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

            - name: Bump service worker cache version
        run: |
          VER="orbit-buddy-$(echo $GITHUB_SHA | cut -c1-7)"
          sed -i "s/const CACHE = 'orbit-buddy-v[^']*';/const CACHE = '$VER';/" public/sw.js
          grep -n "const CACHE" public/sw.js

- name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/smokeys30/orbit-buddy:latest
            ghcr.io/smokeys30/orbit-buddy:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image
        id: deploy
        run: |
          # Capture the currently-deployed image for rollback.
          # In single-revision mode there is only one active revision;
          # rollback means redeploying this image, not shifting traffic weights.
          PREV_IMAGE=$(az containerapp show \
            -g orbit-buddy-rg -n orbit-buddy \
            --query "properties.template.containers[0].image" -o tsv)
          echo "prev_image=$PREV_IMAGE" >> $GITHUB_OUTPUT
          echo "Previous image: $PREV_IMAGE"

          # Deploy the new image. Container Apps creates a new revision
          # and replaces the old one (single-revision mode).
          az containerapp update \
            -g orbit-buddy-rg \
            -n orbit-buddy \
            --image ghcr.io/smokeys30/orbit-buddy:${{ github.sha }} \
            --output none

          # Find the new revision (most recently created)
          sleep 10
          NEW=$(az containerapp revision list \
            -g orbit-buddy-rg -n orbit-buddy \
            --query "sort_by([?properties.active], &properties.createdTime)[-1].name" -o tsv)
          echo "new_revision=$NEW" >> $GITHUB_OUTPUT
          echo "New revision: $NEW"

  verify:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for new revision healthy
        id: health
        run: |
          NEW="${{ needs.build-and-deploy.outputs.new_revision }}"
          echo "Waiting for $NEW to become healthy..."
          for i in $(seq 1 30); do
            STATE=$(az containerapp revision show \
              -g orbit-buddy-rg -n orbit-buddy --revision "$NEW" \
              --query "properties.healthState" -o tsv 2>/dev/null || echo "Unknown")
            echo "Attempt $i: healthState=$STATE"
            if [ "$STATE" = "Healthy" ]; then
              echo "healthy=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            if [ "$STATE" = "Unhealthy" ]; then
              echo "healthy=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep 20
          done
          echo "healthy=false" >> $GITHUB_OUTPUT

      - name: Test public health endpoint
        id: public
        if: steps.health.outputs.healthy == 'true'
        run: |
          for i in $(seq 1 5); do
            CODE=$(curl -s -m 15 -o /dev/null -w "%{http_code}" https://orbitbuddy.app/healthz || echo "000")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              BODY=$(curl -s -m 15 https://orbitbuddy.app/healthz)
              # Parse JSON fields exactly (no grep ambiguity)
              CHECK=$(echo "$BODY" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
              ok=d.get('ok')==True
              drv=d.get('database',{}).get('driver')=='postgres'
              st=d.get('database',{}).get('state')=='ready'
              print('PASS' if (ok and drv and st) else 'FAIL')
          except Exception as e:
              print('FAIL')
              " 2>&1)
              if [ "$CHECK" = "PASS" ]; then
                echo "public_ok=true" >> $GITHUB_OUTPUT
                echo "Verified: ok=true, database=postgres/ready"
                exit 0
              else
                echo "FAIL: health check did not pass (ok/driver/state)"
                continue
              fi
            fi
            sleep 10
          done
          echo "public_ok=false" >> $GITHUB_OUTPUT

      - name: Rollback on failure
        if: steps.health.outputs.healthy != 'true' || steps.public.outputs.public_ok != 'true'
        run: |
          PREV_IMAGE="${{ needs.build-and-deploy.outputs.prev_image }}"
          NEW="${{ needs.build-and-deploy.outputs.new_revision }}"
          echo "::error::New revision $NEW failed verification. Redeploying previous image $PREV_IMAGE."
          # In single-revision mode, rollback = redeploy the previous image.
          # This creates a new revision from the known-good image.
          az containerapp update \
            -g orbit-buddy-rg -n orbit-buddy \
            --image "$PREV_IMAGE" \
            --output none
          echo "::error::Rollback initiated: redeployed $PREV_IMAGE"
          exit 1

      - name: Deployment verified
        if: steps.health.outputs.healthy == 'true' && steps.public.outputs.public_ok == 'true'
        run: |
          NEW="${{ needs.build-and-deploy.outputs.new_revision }}"
          echo "Deployment verified. Revision $NEW is healthy and serving traffic."

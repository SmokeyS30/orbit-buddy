# Auto-deploy Orbit Buddy to Azure Container Apps on push to main
# Requires these GitHub secrets:
#   AZURE_CREDENTIALS - output of: az ad sp create-for-rbac --name orbit-deploy --role contributor --scopes /subscriptions/YOUR_SUBSCRIPTION_ID --sdk-auth
#   GHCR_TOKEN - GitHub personal access token with write:packages scope

name: Deploy to Azure

on:
  push:
    branches: [main]
    paths-ignore:
      - 'infra/**'
      - '**.md'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/smokeys30/orbit-buddy:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App
        run: |
          az containerapp update \
            -g orbit-buddy-rg \
            -n orbit-buddy \
            --image ghcr.io/smokeys30/orbit-buddy:latest

name: Production Monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-buddy-production-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public production health
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://orbitbuddy.app';
          const fetchJson = async (path) => {
            let lastError;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch(`${base}${path}`, {
                  headers: { 'User-Agent': 'orbit-production-monitor/1.0' },
                  signal: AbortSignal.timeout(15_000),
                });
                const body = await response.json();
                if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
                return body;
              } catch (error) {
                lastError = error;
                if (attempt < 3) await new Promise((resolve) => setTimeout(resolve, 5_000));
              }
            }
            throw lastError;
          };

          const live = await fetchJson('/livez');
          if (live.ok !== true) throw new Error('/livez did not report ok=true');

          const ready = await fetchJson('/readyz');
          if (ready.ok !== true || ready.database?.driver !== 'postgres' || ready.database?.state !== 'ready') {
            throw new Error('/readyz did not report postgres/ready');
          }

          const health = await fetchJson('/healthz');
          if (health.ok !== true || health.database?.driver !== 'postgres' || health.database?.state !== 'ready') {
            throw new Error('/healthz did not report postgres/ready');
          }
          if (health.backup?.configured !== true || health.backup?.state !== 'ready') {
            throw new Error(`/healthz backup state is ${health.backup?.state || 'missing'}`);
          }
          console.log('Orbit production health and durable backup status are ready.');
          NODE

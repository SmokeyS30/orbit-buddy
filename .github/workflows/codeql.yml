name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 7 * * 2"
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
      - name: Summarize CodeQL findings
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'codeql-results/javascript.sarif';
          if (fs.existsSync(file)) {
            for (const run of JSON.parse(fs.readFileSync(file, 'utf8')).runs || []) {
              for (const result of run.results || []) {
                const location = result.locations?.[0]?.physicalLocation;
                console.log(JSON.stringify({ rule: result.ruleId, level: result.level,
                  file: location?.artifactLocation?.uri, line: location?.region?.startLine,
                  message: result.message?.text }));
              }
            }
          }
          NODE

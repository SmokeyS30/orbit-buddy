services:
  - type: web
    name: orbit-buddy
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: BUDDY_NAME
        value: Orbit
      - key: CONNECTOR_ENCRYPTION_KEY
        generateValue: true
      - key: BACKUP_ENCRYPTION_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: DATA_DIR
        value: /var/data/orbit
      - key: PUBLIC_BASE_URL
        value: https://orbit-buddy.onrender.com
    disk:
      name: orbit-data
      mountPath: /var/data
      sizeGB: 1
